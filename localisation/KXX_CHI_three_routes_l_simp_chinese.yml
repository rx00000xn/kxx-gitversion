l_simp_chinese:
 CHI: "国民革命政府"
 CHI.lategame.052.b:0 "周佛海与戴春风的中特科控制了局面！"
 CHI.lategame.052.g:0 "第三国际军事代表团控制了局势！"
 KXX_CHI_routes.4.a:0 "维持现状。"
 KXX_CHI_routes.4.b:0 "采纳科皮坦的温和索雷尔主义。"
 KXX_CHI_routes.4.c:0 "适当收敛我们的腐败行为。"
 KXX_CHI_routes.4.d:0 ""
 KXX_CHI_routes.4.t:0 "我们新国家的意识形态"
 CHI_ALO_volkstaat: "西突厥人民总督辖区"
 CHI_Abolish_Religion:0 "废除天皇制度"
 CHI_Abolish_Religion_desc:0 "东京的傀儡君主是亚洲乱源，我们将推倒这尊神龛，撕碎其虚伪与脆弱。让日本列岛明白，唯有臣服打中华秩序，方能得到救赎。"
 CHI_Abolish_the_Minzu_Faction:0 "净化日本民族土壤"
 CHI_Abolish_the_Minzu_Faction_desc:0 "中日两个国家，有永久和平的可能没有呢？我们肯定是有的，在蒋委员长的治理下，大和民族的劣根性将被彻底根除。我们将用汉人的犁耙，翻耕这片被污染的土地，播撒中华文明的种子。"
 CHI_All_Hail_the_Black_Marshal:0 "向伟大领袖三呼万岁!"
 CHI_All_Hail_the_Black_Marshal_desc:0 "一个政党，一个领袖，一个主义!伟大领袖蒋纬国万岁万岁万万岁！"
 CHI_BHC_volkstaat: "天竺人民总督辖区"
 CHI_Build_Upon_National_Marxism:0 "以民族马克思为纲"
 CHI_Build_Upon_National_Marxism_desc:0 "胡宗南的复兴社、戴春风的中特局或是其他的秘密组织实际上都是空洞无物的权力傀儡，因为他们没有真正革命的纲领，蒋纬国委员长决心以民族马克思主义为纲领，重塑这个千疮百孔的中国。"
 CHI_Central_Asian_Liberation:0 "重返中亚"
 CHI_Central_Asian_Liberation_desc:0  "中亚自古以来就有汉人活动，我们必须建立对那里的统治，重建陆上丝绸之路。"
 CHI_Chen_Duxiu_hog_syn: "陈独秀"
 CHI_Chen_Duxiu_hog_syn_desc: "§Y顾问介绍\n生于：§!§g1879年10月8日，安徽省安庆府§!\n§Y派系：§!§g工团党§!\n§Y政治生涯：§!§g$CHI_chen_duxiu_bio$§!\n\n§g现在，陈独秀成为了新上任的中华民国总理（行政院长），他的存在对于维持国民党与工农的关系，对于实现国民革命和社会革命都至关重要。§!\n\n§Y重要信息：虽然中工盟被视为国民革命中的小跟班，但近期召开的人民代表大会令陈独秀得到了工农的调解人和举足轻重组织者的美名，其个人声望也水涨船高。§!"
 CHI_Chinese_Corporatism:0 "中国式社团主义"
 CHI_Chinese_Corporatism_desc:0"新中国的经济模式要以我国的伟大传统制度为骨，国有资本为血，构建全民社团。士农工商应该各安其位，阶级存在是正常现象，我们会推动劳资的调和。"
 CHI_Collectivisation:0 "集体化运动狂潮"
 CHI_Collectivisation_desc:0 "为了中华民族伟大复兴，开展集体化吧！集体化可以加强对农民的管理，并从汉族血汗浇灌的土地中攫取更多资源"
 CHI_Dai_Chunfeng_hog_tot: "戴春风"
 CHI_Developing_the_Motherland:0 "建设祖国从娃娃抓起"
 CHI_Developing_the_Motherland_desc:0 "斯巴达式的教育很符合我们汉族的尚武精神，是时候恢复我们血脉中的强悍基因了，每个儿童必须从小就接受各种最难也是最好的教育并组建为童子军，充当民兵和预备役的一部分。"
 CHI_Eastern_Imperialism_Under_the_Red_Banner:0 "红旗之下的赤色帝国主义"
 CHI_Eastern_Imperialism_Under_the_Red_Banner_desc:0  "举起你的左手打倒帝国主义，举起你的右手打倒工团党！委员长将继承其生父的思想，在黑红旗帜之下建立亚洲新秩序。"
 CHI_Execute_the_Landlords:0 "屠戮国家蛀虫"
 CHI_Execute_the_Landlords_desc:0 "腐败者、懈怠者、异议者，皆是吸食国家血液的蛀虫。蒋委员长将展开清洗运动，用铁腕剜去毒疮，让我国肌体恢复纯净与活力。"
 CHI_Expand_Chinese_Education:0 "文明同化教育"
 CHI_Expand_Chinese_Education_desc:0 "落后的族群需沐浴中华文明之光，强制学习汉语与中华文化。中国是亚洲的哥哥，其他国家都是弟弟。长兄如父，我们将会塑造一个崭新的大亚洲文明。
 CHI_Expand_the_Tridenism_League:0 "壮大我们的同盟"
 CHI_Expand_the_Tridenism_League_desc:0  "委员长下令召集所有以汉族为信仰的勇士，无论之前他们是为复兴社还是黄埔系服务。青白社将吸纳民族主义狂热者，让他们成为捍卫国家的利刃，斩向内外敌人。"
 CHI_Expanding_Greater_Zhongguo:0 "且听龙吟"
 CHI_Expanding_Greater_Zhongguo_desc:0 "中国是一条沉睡的巨龙，其咆哮为民族觉醒之号。让地球震颤，诸国俯首聆听中华威严，中华兵锋所及，皆为新秩序疆土。"
 CHI_Exterminate_the_Japanese_Devils:0 "除 魔"
 CHI_Exterminate_the_Japanese_Devils_desc:0 "倭寇鬼魅从未离开，他们的阴影仍笼罩中华大地。全民拿起武器，从商铺到家庭，驱逐一切倭寇痕迹，血债必须血偿。"
 CHI_FRA_army:0 "法式军队"
 CHI_FRA_bureaucracy:0 "法国体制"
 CHI_FRA_free_france:0 "法兰西公社流亡政府"
 CHI_FRA_global_investment:0 "国际投资"
 CHI_FRA_loyal_syndies:0 "忠诚的工团党"
 CHI_FRA_red_legations:0 "赤色使馆城市"
 CHI_FRA_smuggle:0 "“东方文化研究”"
 CHI_FRA_smuggle2:0 "“东方文化研究”"
 CHI_FRA_syndie_eco:0 "工团主义经济模式"
 CHI_FRA_syndie_eco2:0 "工团主义经济模式"
 CHI_FRA_syndie_eco3:0 "工团主义经济模式"
 CHI_Follow_Gobbels_Economic_Ideas:0 "跟随导师的理念"
 CHI_Follow_Gobbels_Economic_Ideas_desc:0 "虽然戈培尔的思想鼓吹日耳曼人至上，但这并不妨碍蒋纬国把他视为导师，毕竟中德两国目前没有明显的利益冲突。我们要将戈培尔的理念中国化，创造出新的民族社会三民主义。"
 CHI_Form_the_ACTU:0 "组建特别行动队"
 CHI_Form_the_ACTU_desc:0 "我们要选拔绝对忠诚者组建铁拳部队，他们是领袖意志的延伸。黑夜是他们的面纱，异见是他们的靶心，用铁与血维护国家纯净。"
 CHI_Found_RTV:0 "创立国家广播公司"
 CHI_Found_RTV_desc:0 "我们要效仿柏林广播，建立南京中央之声，让每个汉族家庭都聆听国家意志。屏蔽杂音，让蒋委员长的话语如白日普照，禁止一切其他的广播存在。"
 CHI_Hundred_Flowers_Movement:0 "百花齐放运动"
 CHI_Hundred_Flowers_Movement_desc:0 "百花齐放"
 CHI_INC_volkstaat: "安南人民总督辖区"
 CHI_Isolating_India:0 "青藏高原之外"
 CHI_Isolating_India_desc:0  "高原的分离势力已经被粉碎，但为了保卫高原我们必须继续南下，效罗马旧事。"
 CHI_JAP_volkstaat: "东洋人民总督辖区"
 CHI_MMIC_theorist_idea: "第三国际驻华军事代表团"
 CHI_MMIC_theorist_idea_desc: "§Y第三国际驻华军事代表团§!\n§g八省内战后，第三国际向中国派来了驻华军事代表团（法语为Mission Militaire Internationale en Chine，简称MMIC）。先前，社会主义国家就已经为中国革命送来了援助，1924年，一批红俄流亡者被派来援助孙中山，这就是代表团的前身，从此，援助中国革命成为国际工作，社会主义世界的军官们都被吸引到此。\n\n目前，代表团团长是法国人安德烈·马尔罗，他肩负着为国民革命军提供建议、帮国民党打回家两项职责，其他成员包括英国人戴维·拉姆齐、印度人马纳本德拉·纳特·罗易、法国人让·丰特努瓦、挪威人英瓦尔·贝伦廷·奥瑟和乌克兰人雅各布·鲁德尼克（真名保罗·鲁埃格，即牛兰）等。\n\n代表团员中不乏军政官员，其动机亦是千差万别。一些人想来地球另一端冒险，一些人则是在国内籍籍无名，被晋升的诱人希望吸引而来；一些人只是想履行国际主义义务，而一些人却是因为东方主义产生了好奇。\n\n许多国民革命军青年军官，尤其是在海外受训，或是同情工团主义的军官，非常喜爱他们的代表团老师；但是，代表团参与中国政治的行为也受到了一些批评，许多元勋派认为这是过度干预中国内政。而代表团自身则认为，他们是抗衡国民革命军高层中反动势力的必要力量。§!"
 CHI_Mobilise_the_National_Work_Force:0"不劳动就淘汰"
 CHI_Mobilise_the_National_Work_Force_desc:0"懒惰是近代以来导致我们民族衰落的罪魁祸首。劳动乃汉族天职，我们要建立普遍的劳动监督制，无贡献者将被社会和民族的齿轮碾碎。唯有参与民族生存竞争者，方能沐浴国家之光。"
 CHI_National_Communes:0 "国家公社体系"
 CHI_National_Communes_desc:0 "公社自古以来就是我们汉族的伟大传统，通过公社我们无数次打败异族，但它需要被现代化。国家将会亲自组织公社体系，促进社会的发展和民族的复兴。"
 CHI_Organic_Economic_Growth:0 "有机经济增长"
 CHI_Organic_Economic_Growth_desc:0 "根据我们的理论，国家经济就是一个庞大的有机体，委员长为大脑，广大士农工商为手足。我们的法团主义政策会协调各产业，摒弃无序竞争，让每一分财富都流向国家强健的脉络。"
 CHI_PHI_volkstaat: "南洋人民总督辖区"
 CHI_Purge_the_KMT:0 "取代国民党的地位"
 CHI_Purge_the_KMT_desc:0 "国民党已经毫无作用，我们只需要它的符号来提供一些合法性罢了，委员长治下的青白社将成为法定的最高党政军掌控者。"
 CHI_RUS_volkstaat: "罗刹人民总督辖区"
 CHI_Socialize_NBIS:0 "接管情报系统"
 CHI_Socialize_NBIS_desc:0 "戴春风的旧情报网络需要被清洗，安插绝对忠诚于委员长的人，我们要做到比戴春风更加小心，不然委员长也可能会布他的后尘！"
 CHI_The_Chinese_Autobahn:0 "铁道乃国家之血管"
 CHI_The_Chinese_Autobahn_desc:0 "德国目前开展了如火如荼的铁路建设运动，先总理也提出过铁路建设方案。蒋委员长决定继承和发扬这一政策，重启铁路建设运动，疏通我国交通网络。"
 CHI_The_Red_Sun_Over_A_Black_Sky:0 "黑穹下的红日"
 CHI_The_Red_Sun_Over_A_Black_Sky_desc:0 "当世界陷入混沌黑夜，委员长领导下的中华便是唯一红日。领袖的光芒将穿透帝国主义的阴霾，凡沐浴者皆得庇护，违逆者将在钢铁洪流中化为灰烬，此乃天命昭昭。"
 CHI_The_Tigers_Down_South:0 "擒虎"
 CHI_The_Tigers_Down_South_desc:0  "中南半岛以位于中华南部得名，是时候让他们沐浴王化了。"
 CHI_Unite_the_East:0 "确保东亚霸权"
 CHI_Unite_the_East_desc:0  "如果大家集中一条心，往蒋委员长指出的路来走，我们一定能够建立大东亚战争，我们一定能够兴复中华，我们一定能够保卫东亚！"
 CHI_Utilize_the_Han_Supremacy:0 "天选汉族唯一"
 CHI_Utilize_the_Han_Supremacy_desc:0 "中华土地只容天选之族，满、回等皆为旁支。推行汉化政策，语言、文化、血脉必须纯一，这是天命所归的秩序，东亚是汉人的东亚。"
 CHI_Victory_of_the_Left_CC:0 "不可能的胜利...."
 CHI_Victory_of_the_Left_CC_desc:0 "在多灾多难的首都，少壮派军官蒋纬国带领他的秘密组织青白社取得了不可能的胜利。他把目光投到了亚欧大陆的另一端，摩拳擦掌准备学习戈培尔新德国的思想，但主角要换成伟大的汉族！"
 CHI_Western_Expansion:0 "向西方进军"
 CHI_Western_Expansion_desc:0   "近代以来，俄寇蚕食我国领土最多，是时候和德国同志一起猎杀俄罗斯巨熊了！"
 CHI_YGD_assimilate_NCERA:0 "吸纳新帝改协"
 CHI_YGD_assimilate_NCERA_desc:0 "新帝国宪政会和我们有着相似的根基支持和目标。我们同他们都受到农民的支持和青睐，都希望能够帮助中国的普通百姓。这样看来，也许他们会对我们有莫大的帮助。"
 CHI_YGD_consolidate_civ_power:0 "权力归于中央"
 CHI_YGD_consolidate_civ_power_desc:0 "尽管民国怎样还是我们说了算，但管理机构中的很多人毫无疑问地抓住了我们继位后混乱局面的机会。我们可不能重蹈旧政府的覆辙，必须得从这群机会主义者手中夺得权力。在我们的统治下，权力争斗将不复存在。"
 CHI_YGD_consolidated_rule:0 "实现对国内的掌控"
 CHI_YGD_consolidated_rule_desc:0 "挟天子以令诸侯，我们剥夺了满洲勋贵的权利，明确了信仰才是我们政治体制和思想的内核，确保了我们的军事地位同时收编了直系军阀残党。可以确切的说，现在我们的政治地位是非常稳固的，整个中国将在我们不可动摇和仁慈开明的统治下有着光明的未来。"
 CHI_YGD_convert_zhili_monarchists:0 "皈依的革命派"
 CHI_YGD_convert_zhili_monarchists_desc:0 "虽然皇帝有很多支持者，但他们并不支持一贯道。这使得他们对我们了统治表示抗议。为了安抚他们，我们会出台一些一贯道任务来表示我们同他们并没有什么不同，大家可以一起并肩作战。无论如何，我们总有办法让他们看到光明的未来。"
 CHI_YGD_destroy_secularists:0 "消灭世俗主义者的影响"
 CHI_YGD_destroy_secularists_desc:0 "许多批评我们政体的人指责宗教狂热就是个错误，这是不对的。而且这群人还有日本人和其他敌对组织有联系。让我们削弱他们的力量，维护我们的坚定信仰。"
 CHI_YGD_dispatch_missionaries:0 "派遣传教士"
 CHI_YGD_dispatch_missionaries_desc:0 "中国人民和他们的流传至今的传统可能是世界上最古老，也是最受尊敬的。然而就在最近非常不幸的是，中国人民正在忘记他们的信仰和老祖宗的传统，反而更喜欢从西方传过来的自由主义和社会主义的低劣意识形态。我们必须得加大向全国文化精神输入的力度，无论如何都得让我们的传统和信仰传承下去。"
 CHI_YGD_expand_control:0 "加强信仰"
 CHI_YGD_expand_control_desc:0 "信仰，无疑是每个人一生中最重要的支柱之一。和满洲王公和浮夸的直系将领不一样，我们在日常的所有场合，无论是政事还是人们的日常生活当中，都要保证信仰。这样我们能在纯净而不可动摇的信仰之下团结起来，领导整个国家前进。"
 CHI_YGD_factories1:0 "奖励忠诚的实业家"
 CHI_YGD_factories1_desc:0 "接管中华民国之后，许多人因为对我们的倒车现象感到失望而背弃离去已经不是什么秘密了，这其中就有一些撤资的企业家和商人。如果给留下来的人给予一些特权，向其展现我们的仁慈之治。他们就会帮助我们建立一个更强大的中国。"
 CHI_YGD_factories2:0 "大规模工业化"
 CHI_YGD_factories2_desc:0 "不可否认，这并不符合我们农民支持者的利益，但是工厂、铸造厂、钢铁厂才是中国的未来。我们可以否认它们，因为中国因此进入了一个屈辱时代，但不可否认的是，适当的接受它们的确可以推动中国进入一个新时代。"
 CHI_YGD_guiyidao:0 "招纳皈一道"
 CHI_YGD_guiyidao_desc:0 "虽然我们同皈一道早有联系，但是他们有着自己的势力范围。为了实现真正的统一，我们应该直接把他们纳入旗下。"
 CHI_YGD_holy_meritocracy:0 "任人唯贤"
 CHI_YGD_holy_meritocracy_desc:0 "近年来，科举制已经落寞了。中国笼罩在日渐腐败、停滞不前、军阀混战的阴影之下。我们将改革复兴科举制度为中国甄选最具才智之人。"
 CHI_YGD_hubei:0 "谴责湖北的地主"
 CHI_YGD_hubei_desc:0 "地主和富农们控制着中国超过四分之三的土地，而下层阶级的人们只能够在他们的剥削下自力更生。我们必须打倒这群猖獗的地主，来获得广大农民群众的真心支持。"
 CHI_YGD_infiltrate_military:0 "渗透军队"
 CHI_YGD_infiltrate_military_desc:0 "虽然有很多人忠于我们的事业并在名义上控制着民国，但是仍有很多前国民革命军的人不信服我们。如果想要获得成功，就必须尽量让这群人站到我们这边，而不听话的就请他消失。"
 CHI_YGD_infra:0 "神圣之路"
 CHI_YGD_infra_desc:0 "我们不缺农民、工人和工匠，但是帝国疆土辽阔并且城乡道路维护不佳。改善中国的基础设施能够是老百姓们更安全便捷的通行劳作，毕竟一个有人生安全的农名才是一个有生产力的好农民。"
 CHI_YGD_jinan:0 "扩建济南的矿区"
 CHI_YGD_jinan_desc:0 "山东济南，中国众多美丽城市中的一个典范。恰巧，这座城市的土壤下藏着很多宝贵资源，能够为我们提供原料以锻造更多的枪支。而为了全中国的美好，我们有必要增多该地区的开采工作来获取这些财富。"
 CHI_YGD_legal_reform:0 "发起法制改革"
 CHI_YGD_legal_reform_desc:0 "对于任何一个有自尊心的人来说，至少我们的政策在客观上是政通人和的。但是，仅仅靠常识和道德约束来管理国家是不够的。我们应该为虔诚的中华民国修订一部新宪法来把我们的哲学理念和行为规范纳入法律框架，以此来规范行为准测和信念信仰并且还得让我们的好公民对其了如指掌。"
 CHI_YGD_re_educate_emperor:0 "重新教导皇帝"
 CHI_YGD_re_educate_emperor_desc:0 "虽然实至名归的天子很不情愿地接受了我们的学说，但若没有皇上的支持，何来像中国这样伟大的帝国？必须要向宫中派遣导师和传教士，让皇上改变主意，以避免我们合法性的动荡。"
 CHI_YGD_secure_rail_nodes:0 "保障铁路枢纽"
 CHI_YGD_secure_rail_nodes_desc:0 "尽管重新建立了官僚机构，但是顽固派对我们的仁慈统治不知好歹。他们炸毁我们的铁路，阻碍我们的后勤工作和军事补给路线。派人去守卫这些铁路节点，杀除这群抵抗我们的害虫来解决这个问题。"
 CHI_YGD_sideline_manchu:0 "排挤狡猾勋贵"
 CHI_YGD_sideline_manchu_desc:0 "西山会议派在我们掌权之后就一直对我们怀恨在心，肯定不会错过任何一个夺权的机会。他们对我们不忠，还密谋反对我们而间接违抗圣恩。因此无论如何，我们都得建立一个不受他们干涉影响的统治。"
 CHI_Zhongguo_for_Years:0 "华夏千年永续"
 CHI_Zhongguo_for_Years_desc:0  "历史证明，亚洲不需要西方的施舍，更不需要他们指手画脚，亚洲的未来，本该由中华的手掌握，只有我们的秩序，才是这片土地上真正的正道。我们付出了代价，付出了无法计数的牺牲。可正因如此，中华民族才更加清醒，唯有彻底撕碎那层虚假的“全球规则”，彻底踏碎那些在亚洲散播毒瘤的殖民余孽，亚洲才能重归大一统。而这条路，唯有我们能走，唯有中华民族能引领。没有什么平等，也没有什么多元。中华民族高于一切，高于亚洲一切民族，高于一切旁支杂裔。割开我的血管，你只能看到华夏的赤色。"
