 artillery_equipment_desc:0 "火炮是指大口径武器，如加农炮榴弹炮等由人员操作射程可以远超过个人武器有效范围。"
 KXX_CHI_routes.1.a:0 "小小兴致就随他去吧，只要他不把公私搞混了就行"
 KXX_CHI_routes.1.b:0 "李丽久还是周主席的朋友，但周佛海就得和一贯道分道扬镳了"
 KXX_CHI_routes.1.d:0 "周佛海主席在公众眼中的一般印象是著名的革命左翼人士、中华民国最伟大的革命派之一，但在那些真正熟知他的人看来却又是另一番故事了。周佛海一直热衷于研究神秘主义、神智学、灵性论等神秘学学科，他把工作之外的大部分时间都花在了自己的精神开化上。不过，这一半遮半掩的兴趣爱好却在周佛海就职前被公之于众，而他也因这些疯狂的想法当场遭到了反对派的冷嘲热讽。事情是这样的，不知为何，他与好友李丽久的通信被曝了出来，而这个所谓的李丽久是活跃于山东的一贯道精神领袖，他们将已逝的张天然进行了精神神化。虽然这一事情遭到了封锁掩盖，暂时避过了风波，但周佛海依旧不改其热情，还在身边聚集起了一群一贯道同僚，并开始在国内小规模传播自己的理念。那么，我们是要冒着打破精心构筑起的互利共存之平衡的风险，放任不管，让他去追求什么精神开化，还是让他乖乖闭上自己的嘴呢？"
 KXX_CHI_routes.1.t:0 "周主席的怪朋友"
 KXX_CHI_routes.2.a:0 "雇工离开了，周佛海第二天被发现死于家中，周佛海的幕僚兼密友李丽久被选为临时主席。"
 KXX_CHI_routes.2.b:0 "雇工打开了门，阻止了正准备行凶的刺客。"
 KXX_CHI_routes.2.d:0 "今夜是鲜有的周佛海主席在家中过夜的一晚，近些日子周佛海为党国操劳了不少事务，一个小时前他还待在书房里翻看文件。一想到这里，周佛海家中的雇工便灭了手中的灯笼轻手轻脚地向前走。\n由于工作的原因雇工今晚下班的时间比往常晚上的不少，周佛海家中人也承诺多给点工薪，雇工也并没有过多抱怨，在完成了工作后才返程回家。然而就在接近周佛海房门前时，屋内忽然传出了异响。这声音像是什么东西打开了一般微弱地吱了一声，但在房门前仍然听得十分清楚。“莫不是进了什么贼？”雇工立刻担忧了起来，他的内心此时也陷入了进退两难中。如若自己此时冲进去，会不会打扰到主席休息？届时自己的工作恐怕也要被罢去。但如果视而不见，那么主席会不会有什么意外？不过，宅中的安保就平时的观察而言是值得信赖的，但心中仍是有些顾虑。究竟是进去还是离开，内心的顾虑使他难以做出选择。"
 KXX_CHI_routes.2.t:0 "烛影斧声"
 KXX_CHI_routes.3.a:0 "袁克定，中华帝国的正统继承人。"
 KXX_CHI_routes.3.b:0 "延恩侯朱煜勋,明朝的正统继承人。"
 KXX_CHI_routes.3.c:0 "衍圣公孔令贻，商朝的血脉。"
 KXX_CHI_routes.3.d:0 "在中华漫长的历史长河中反应出了中国需要一个适用于本国国情的特色君主制，我们的国民需要一个皇帝。\n这绝非什么臆想和空谈，回望过去的历史，我们的华夏在过去的几千年中取得了无数的灿烂成就。而这些时期都有一个显著的特征，及有一个贤明的君主庇佑着他们的国民，所以我们有理由相信拥有无限智慧的君主制是世间最好的制度。但清代的教训又警醒着我们给予君主过多的权利只会给我们前进的道路上设下障碍，所以我们应对传统的君主制做出进度的修正。\n目前中国特色君主制的改革工作由我们的领袖李丽久主持，国家元首由主席变更为总理及相关政府部门的改革工作已经完成，是时候决定谁将会成为我们国民的新皇帝了。"
 KXX_CHI_routes.3.e:0 "台湾明王郑守让，尽管他并不这么正统。"
