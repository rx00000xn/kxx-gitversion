 KXX_shared_for.21.t:0 "来自国民党的最后通牒"
 KXX_shared_for.21.d:0 "国民党将两个选项摆在我们面前：以外交方式和平统一，或者被武力摧毁。我们的军队看起来在他们面前不堪一击，所以我们要小心考虑。"
 KXX_shared_for.21.a:0 "我们没有回绝的余地"
 KXX_shared_for.21.b:0 "列强会保我们的"
 KXX_shared_for.22.t:0 "来自使馆城市的回应"
 KXX_shared_for.22.d1:0 "使馆城市在压迫了中国人民那么多年后最终同意回归中国。上海，香港，还有无数这样的地方许多年以来从未真正得到过自由，无数人在欧洲帝国主义者的奴役下生老病死。如今，随着这些核心城市已经处于我们掌控下，他们终于从欧洲帝国主义殖民者的手中解放了出来！"
 KXX_shared_for.22.d2:0 "使馆城市拒绝了我们理所当然的正当要求并且乞求欧洲列强保护。这并不能让他们在我们蓄势待发的大军面前得救。问题只是我们要不要立即发起进攻呢？"
 KXX_shared_for.22.a:0 "永别了，帝国主义者！"
 KXX_shared_for.22.b:0 "帝国主义一向不守信用"
