 CHI_party_influence_extreme: "党内影响力：§R如日中天§!" KXX_shared_McMahon.1.t:0 "中国的使者"
 KXX_shared_McMahon.1.d:0 "今天中国派来使者要求同我方就达旺地区的归属进行磋商。这一提案自一提出就遭到了军方的反对，是的，达旺地区自从1914年麦克马洪特使主持的会议就已经确定了归于印度所有，这些中国人出尔反尔实在令人讨厌。\n但是政府内不乏冷静的政治家，所谓中英藏西姆拉会谈不过是英国人帝国主义做派的又一体现，他们敲诈勒索中国人，却把赃物转交给印度，这些可能灾祸和风险也同时给了祖国。我们相信，中国人是带着诚意来的，但是民族情绪日益激烈的印度人民可能会失去理智而将我们的潜在盟友拒之门外。\n中国特使的提议稍稍缓和了局面，至少我们应该听听他们要说什么。"
 KXX_shared_McMahon.1.a:0 "让我们看看他们想要付出什么代价"
 KXX_shared_McMahon.1.b:0 "达旺是我们的，这件事情不需要谈"
 KXX_shared_McMahon.2.t:0 "印度人同意谈判"
 KXX_shared_McMahon.2.d:0 "虽然我们感到了印方人员的不满，但好在他们还愿意坐下来谈谈。显然这次谈判并不是那么简单，国内的一些将军已经高呼武力拿下藏南了，但是在这之前我们必须做出尝试，如果能付出一些代价来和平换取中印的和平，这对我们未来在国际上的地位和形象举足轻重。"
 KXX_shared_McMahon.2.a:0 "开始谈判"
 KXX_shared_McMahon.3.t:0 "印度人拒绝了和平"
 KXX_shared_McMahon.3.d:0 "印度人轰走了我们的使者！\n\n原本气氛融洽的议事厅安静的令人窒息，继而便传来将军们暴躁的声音。这无疑是我们建国之初的一次巨大的耻辱，我们可能要趁此机会向这些无知狂妄的印度人宣战了，让他们知道，我们国土完整神圣不容侵犯。"
 KXX_shared_McMahon.3.a:0 "不把他们打痛，他们永远不会知道中国人站起来了"
 KXX_shared_McMahon.4.t:0 "中国人的提案"
 KXX_shared_McMahon.4.d:0 "中国人十分理解印度人民对达旺的情绪，他们为此提出了一个折中的方案，那就是让达旺地区成为一个双方共同管理的缓冲区，达旺地区的资源两国共享。他们提出要修建一条中印铁路，让达旺地区成为中印友好交流的门户。\n\n不得不说中国人的言语十分漂亮，一番商议之后工业部门和贸易部门都非常支持这一提案，军方似乎也有松动，毕竟为了一小块地盘和所谓面子之争实在不值得。中国特使的致辞说的好，两国恰是从殖民之下解放出来的国家，应该友好互助，借助资源和人口优势走向世界，而不是再一次让双方的祖国母亲陷入战火。"
 KXX_shared_McMahon.4.a:0 "告诉他们，我们同意"
 KXX_shared_McMahon.4.b:0 "说的天花乱坠，还不是拿走了我们的土地！"
 KXX_shared_McMahon.5.t:0 "藏南问题和平解决"
 KXX_shared_McMahon.5.d:0 "印方代表在达旺和中国签订了中印友好互助条约！\n\n随着条约的签署，两国人民的深厚友谊就此结下，达旺这座1914年被肮脏的帝国主义英国诅咒的纷争之地，在两国人民的友谊之下化作了两国交流的门户。"
 KXX_shared_McMahon.5.a:0 "万岁！"
 China_india_friendship_tt: "§G当中国是阵营领导者，我们将可以邀请社会主义印度加入我们的阵营§!"
 KXX_shared_for.6.t:0 "国民党一波又一波的破坏活动"
 KXX_shared_for.6.d:0 "[ROOT.GetName]军队的检查点和铁路线遭受了一系列的炸弹袭击，损害了我们的军事能力。这些破坏活动据线报为国民党的地下组织所策划实施，但截至目前我们的保卫部门只抓获了极少数的几个特务。更令人不安的是，这些破坏行动只针对我们的部队以及那些有助于我们对抗[CHI.GetNameDef]的资源，这表明他们的情报活动对我军动向有着极高程度的掌握。\n\n前线方面则反馈称，有迹象表明国民党正在筹划对我们发起一项大规模进攻。"
 KXX_shared_for.6.a:0 "我们必须做好最坏的打算！"
 KXX_shared_for.7.t:0 "国民党准备攻击我们"
 KXX_shared_for.7.d:0 "在我们同[CHI.GetNameDef]相邻边界处传来的报告表明，他们在边界上部署的兵力显著的升高了。我军检查点附近的可疑活动增多、兵营附近散发的传单等似乎都指向国民党地下党组织正尝试暗中破坏我军防御。他们或许会在不久的将来发动入侵。"
 KXX_shared_for.7.a:0 "我们必须做好最坏的打算！"
